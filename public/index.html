<!DOCTYPE html>
<html lang="en">

<head>
	<title> Buy VLX</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="html.design">
	<meta name="description" content="Buy VLX">
	<meta name="keywords"
		content="velas, vlx, cryptocurrency, wallet, cryptocurrency wallet, wallet secure, web wallets, ai, artificial intelligence, dapp, blockchain">
	<link rel="shortcut icon" href="images/velas-icon.png">
	<link rel="stylesheet" href="/public/css/bootstrap.min.css">
	<link rel="stylesheet" href="/public/css/style.css">
	<link rel="stylesheet" href="/public/css/responsive.css">
</head>

<body>

	<div class="wizard-main">
		<div class="container">
			<div class="row">
				<div class="col-lg-6 login-sec">
					<div class="login-sec-bg">
						<h2 class="text-center">Buy VLX</h2>
						<form id="buy-form" action="#" style="display: none;">
							<h3>Choose</h3>
							<fieldset class="form-input">
								<h4>Providers:</h4>
								<input id="provider" value="Simplex" name="chooseProvider" onclick="onlyOneChoice(this)"
									type="checkbox" class="required"> <label for="provider">
									<div><img class="provider-style" src="images/simplex_logo.png" /></div>
								</label><br />
								<input id="provider1" value="Ramp" name="chooseProvider" onclick="onlyOneChoice(this)"
									type="checkbox" class="required"> <label for="provider1">
									<div><img class="provider-style1" src="images/ramp-logo.png" /></div>
								</label>
								<p id="title_notice" class="title_notice" />
								<div id="row_notice">
									<p id="row_left_side" />
									<p id="row_right_side" />
								</div>
								<div id="row_notice">
									<p id="row1_left_side" />
									<p id="row1_right_side" />
								</div>
								<div id="row_notice">
									<p id="row2_left_side" />
									<p id="row2_right_side" />
								</div>

							</fieldset>

							<h3>Amount</h3>
							<fieldset class="form-input" id="post">
								<h4>Enter Amount:</h4>
								<label for="amount">Amount</label>
								<input id="amount" name="amount" type="number" pattern="^\d*(\.\d{0,2})?$"
									class="form-control required number" placeholder="0.00" value=""
									onkeyup="trackChange(this.value)">
								<div class="subtitle-input">
									<p>Current Price:</p>
									<p class='price_usd' />
								</div>

								<div class="subtitle-input">
									<p>Your Address:</p>
									<p id="address" class="address" onclick="openAddress()" />
								</div>
								<div class="subtitle-input">
									<p>Your Provider:</p>
									<p id="checkedValue" />
								</div>
								<div class="subtitle-input">
									<p>Fee:</p>
									<p>0.00044 VLX</p>
								</div>
								<div class="subtitle-input">
									<p>Total:</p>
									<p id="yourAmount">0.00 VLX</p>
								</div>
								<input id="acceptTerms-2" name="acceptTerms" type="checkbox" class="required"> <label
									for="acceptTerms-2" class="required">I agree with the Terms and Conditions.</label>

							</fieldset>
							<h3>Confirm</h3>
							<fieldset class="form-input">
								<h4>Some Wireframe</h4>
							</fieldset>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="/public/js/jquery.min.js"></script>
	<script src="/public/js/popper.min.js"></script>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src='/public/js/jquery.validate.js'></script>
	<script src="/public/js/jquery.steps.js"></script>


	<script>
		var address = '2aKpGt3AjY3cJnZtstDrt3bjhEPoTrQcydtwgTxRH8uPyDFNZQ9kgWfuX6Qy4dy6MRZhx3XSCd8DNkNhzGZPakdA';
		var currency = 'VLX'
		var order_number = '78fe90a4-1980-b82f-c1af-58cf92fd3a9e'
		var amount = document.getElementById("amount").value;

		function onlyOneChoice(checkbox) {
			var checkboxes = document.getElementsByName('chooseProvider')
			checkboxes.forEach((item) => {
				if (item !== checkbox) item.checked = false
			})
			var checkedValue = document.querySelector('.required:checked').value;
			document.getElementById("checkedValue").innerHTML = checkedValue;
			var title = "You are about to receive funds using fiat funds:"
			var row_left_side = 'Your address:'
			var row_right_side = address
			var row1_left_side = 'Cryptocurrency:'
			var row1_right_side = currency
			var row2_left_side = 'Provider:'
			var row2_right_side = checkedValue
			var title1 = "Click Next to continue"

			if (checkedValue) {
				document.getElementById("title_notice").innerHTML = title;
				document.getElementById("row_left_side").innerHTML = row_left_side;
				document.getElementById("row_right_side").innerHTML = row_right_side;

				document.getElementById("row1_left_side").innerHTML = row1_left_side;
				document.getElementById("row1_right_side").innerHTML = row1_right_side;

				document.getElementById("row2_left_side").innerHTML = row2_left_side;
				document.getElementById("row2_right_side").innerHTML = row2_right_side;
			}
		}

		document.getElementById("address").innerHTML = address;
		function openAddress() {
			window.open(`https://native.velas.com/tx/${address}`);
		}

		function getCurrensies() {
			$.getJSON("https://explorer.velas.com/ticker", function (data) {
				var price_usd = $('.price_usd').text(`$ ${data.price_usd} / 1 ${currency}`)
			});
		}
		getCurrensies();

		function trackChange(value) {
			document.getElementById("yourAmount").innerHTML = `${value ? value : '0.00'} ${currency}`;
		}


		var form = $("#buy-form").show();
		form.steps({
			headerTag: "h3",
			bodyTag: "fieldset",
			transitionEffect: "slideLeft",
			labels:
			{
				finish: "Confirm",
			},
			onStepChanging: function (event, currentIndex, newIndex, value) {
				if (currentIndex > newIndex) {
					return true;
				}

				if (currentIndex < newIndex) {
					form.find(".body:eq(" + newIndex + ") label.error").remove();
					form.find(".body:eq(" + newIndex + ") .error").removeClass("error");

				}
				if (currentIndex === 1 && Number($("#amount").val()) > 0) {
					$("#amount").ready(function () {
						$.post("http://localhost:5500/api/v1/simplex/quote",
							{
								crypto_currency: "BTC",
								fiat_currency: "USD",
								crypto_amount: amount,
								address: "1DjzbLveepGxTUiwZnooBmLfRLgMAcdy6N",
								debug: 1
							},
							function (data, status) {
								alert("Data: " + data + "\nStatus: " + status);
							}
						);
					});
				}

				form.validate().settings.ignore = ":disabled,:hidden";
				return form.valid();
			},
			onFinishing: function (event, currentIndex) {
				form.validate().settings.ignore = ":disabled";
				return form.valid();
			},
			onFinished: function (event, currentIndex) {
				// alert(`You will be redirected to Simplex to complete your purchase. Please save your order number. Your personal order number: ${order_number}`),
				window.open('https://www.simplex.com/');
			}
		}).validate({
			errorPlacement: function errorPlacement(error, element) { element.before(error); },
			rules: {
				confirm: {
					equalTo: "#password"
				}
			}
		});
		$(document).on('keydown', 'input[pattern]', function (e) {
			var input = $(this);
			var oldVal = input.val();
			var regex = new RegExp(input.attr('pattern'), 'g');

			setTimeout(function () {
				var newVal = input.val();
				if (!regex.test(newVal)) {
					input.val(oldVal);
				}
			}, 1);
		});
	</script>
</body>

</html>
